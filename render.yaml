services:
  - type: web
    name: kenko-ai-1
    runtime: python
    buildCommand: npm install && npm run build && pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://kenko-ai-1.onrender.com/api/google/callback
      - key: FRONTEND_URL
        value: https://kenko-ai-1.onrender.com
      - key: JWT_SECRET
        generateValue: true

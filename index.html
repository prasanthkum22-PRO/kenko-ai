<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KENKO-AI — Enterprise clinical intelligence platform. Consultations, transcription, prescriptions, laboratory and pharmacy workflows in one secure system." />
    <meta name="theme-color" content="#F6F8FB" />
    <title>KENKO-AI — Clinical Intelligence Platform</title>
    <script>
      (function () {
        var saved = localStorage.getItem('kenko_theme');
        var theme = saved === 'dark' ? 'dark' : 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        root.classList.add(theme);
        root.classList.remove(theme === 'dark' ? 'light' : 'dark');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
